name: Сайт памятки

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Проверка идёт первой и раньше сборки: красная проверка отменяет
      # раздел «Готовность» целиком, и публиковать в таком виде нечего.
      - name: Проверка памятки
        run: python tools/check.py

      - name: Установка MkDocs
        run: pip install "mkdocs-material==9.*"

      - name: Сборка сайта
        run: python tools/build-site.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
