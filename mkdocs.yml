site_name: "System Design — рабочая памятка"
site_description: "Метод проектных решений: рабочий процесс, документы решений, карточки и прогоны"
site_url: https://gorynychart.github.io/system-design-guide/
repo_url: https://github.com/GorynychArt/system-design-guide
repo_name: GorynychArt/system-design-guide
edit_uri: edit/master/
copyright: "Памятка ведётся открыто: каждое правило стоит на прогоне или на источнике"

docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

plugins:
  - search:
      lang: ru

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:      # - [ ] и - [x] как чекбоксы, а не как текст
      custom_checkbox: true
  - pymdownx.tilde          # ~~зачёркивание~~
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GorynychArt/system-design-guide

