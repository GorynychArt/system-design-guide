site_name: "System Design — рабочая памятка"
site_description: "Метод проектных решений: рабочий процесс, документы решений, карточки и прогоны"
site_url: https://gorynychart.github.io/system-design-guide/
repo_url: https://github.com/GorynychArt/system-design-guide
repo_name: GorynychArt/system-design-guide
edit_uri: edit/master/
copyright: "Памятка ведётся открыто: каждое правило стоит на прогоне или на источнике"

docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

plugins:
  - search:
      lang: ru

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      toc_depth: 3
  - admonition
  - pymdownx.details
  - pymdownx.tasklist:      # - [ ] и - [x] как чекбоксы, а не как текст
      custom_checkbox: true
  - pymdownx.tilde          # ~~зачёркивание~~
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - assets/w1-calculator.js

extra_css:
  - assets/w1-calculator.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GorynychArt/system-design-guide

# Внутренняя кухня: прогоны, исследование и рабочие планы остаются на сайте —
# на них ведут 152 ссылки из карточек и решений, — но в меню и в поиск не идут.
not_in_nav: |
  examples/**
  research/**
  99-plan.md
  96-backlog.md
  98-revision-plan.md

nav:
  - Памятка: index.md
  - Рабочий процесс: 00-workflow.md
  - Дорожная карта: 01-roadmap.md
  - Карточки:
      - topics/index.md
      - topics/01-network-and-api.md
      - topics/02-traffic-and-edge.md
      - topics/03-storage-and-data.md
      - topics/04-caching.md
      - topics/05-async-and-messaging.md
      - topics/06-distributed-systems.md
      - topics/07-architecture-styles.md
      - topics/08-reliability.md
      - topics/09-security.md
      - topics/10-delivery-and-ops.md
      - topics/11-performance-and-cost.md
      - topics/12-case-studies.md
  - Решения:
      - decisions/index.md
      - Мастер-шаблон: decisions/00-template.md
      - Шаблон ADR: decisions/01-adr-template.md
      - Версионирование: decisions/02-versioning.md
      - Реестр ограничений: decisions/03-constraints-registry.md
      - decisions/D-01-storage-choice.md
      - decisions/D-02-service-boundaries.md
      - decisions/D-03-caching-strategy.md
      - decisions/D-04-workflow-coupling.md
      - decisions/D-05-initial-boundaries.md
      - decisions/D-06-degradation.md
      - decisions/D-07-data-decomposition.md
      - decisions/D-08-data-migration.md
      - decisions/D-09-rollback.md
      - decisions/D-10-service-level-objectives.md
      - decisions/D-11-interface-compatibility.md
  - Справочники:
      - 90-cheatsheets.md
      - 91-antipatterns.md
      - 92-glossary.md
      - 93-playlist-map.md
      - 94-gaps.md
      - 95-sources.md
      - 97-card-map.md
